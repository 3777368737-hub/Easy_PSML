services:
  - type: web
    name: gradpilot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: QWEN_API_KEY
        sync: false
      - key: QWEN_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: QWEN_ASR_MODEL
        value: qwen-audio-3.1-asr-flash-streaming
      - key: QWEN_ASR_FILE_MODEL
        value: qwen-audio-3.1-asr-flash
      - key: QWEN_ASR_VAD_MODEL
        value: near_meeting_16k
      - key: QWEN_ASR_MAX_SENTENCE_SILENCE_MS
        value: "1200"
      - key: QWEN_INTENT_MODEL
        value: qwen-plus-latest
      - key: APP_CORS_ORIGINS
        sync: false
      - key: DATABASE_PATH
        value: /var/data/gradpilot.db
    disk:
      name: gradpilot-data
      mountPath: /var/data
      sizeGB: 1
